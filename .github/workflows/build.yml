name: Build & Release Music Player

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    timeout-minutes: 30

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      # ---------------- CHECKOUT ----------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------- PYTHON ----------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ---------------- DEPENDENCIES ----------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # ---------------- LINUX BUILD ----------------
      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

          xvfb-run pyinstaller --noconfirm --windowed --name MusicPlayer \
            --add-data "assets:assets" \
            main.py

      # ---------------- MAC BUILD ----------------
      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          pyinstaller --noconfirm --windowed --name MusicPlayer \
            --add-data "assets:assets" \
            --icon assets/icon.icns \
            main.py

      # ---------------- WINDOWS BUILD ----------------
      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          pyinstaller --noconfirm --windowed --name MusicPlayer `
            --add-data "assets;assets" `
            --icon assets/icon.ico `
            main.py

      # ---------------- ZIP OUTPUT ----------------
      - name: Create zip
        run: |
          python -c "import shutil; shutil.make_archive('MusicPlayer-${{ matrix.os }}', 'zip', 'dist')"

      # ---------------- UPLOAD ARTIFACT ----------------
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicPlayer-${{ matrix.os }}
          path: MusicPlayer-${{ matrix.os }}.zip

  # ================= RELEASE JOB =================
  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      # ---------------- CHECKOUT ----------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------- DOWNLOAD ARTIFACTS ----------------
      - name: Download all builds
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      # ---------------- CREATE TAG ----------------
      - name: Create tag
        id: tag
        run: |
          echo "TAG=v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT

      # ---------------- CREATE GITHUB RELEASE ----------------
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: Music Player ${{ steps.tag.outputs.TAG }}
          draft: false
          prerelease: false
          files: release-assets/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

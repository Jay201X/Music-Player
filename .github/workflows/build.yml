name: Build Music Player

on:
  push:
    branches: [ main ]

permissions:
  contents: write   # REQUIRED for releases

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # ---------------- VERSION ----------------
      - name: Generate version
        if: matrix.os == 'ubuntu-latest'
        run: echo "VERSION=v1.0.${{ github.run_number }}" >> $GITHUB_ENV

      # ---------------- WINDOWS ----------------
      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller --noconfirm --windowed --name MusicPlayer --add-data "assets;assets" --icon assets/icon.ico main.py
          powershell Compress-Archive -Path dist\MusicPlayer -DestinationPath MusicPlayer-Windows.zip

      # ---------------- MACOS ----------------
      - name: Build macOS
        if: matrix.os == 'macos-latest'
        run: |
          pyinstaller --noconfirm --windowed --name MusicPlayer --add-data "assets:assets" --icon assets/icon.icns main.py

          mkdir dmg
          cp -R dist/MusicPlayer.app dmg/
          hdiutil create MusicPlayer-macOS.dmg -srcfolder dmg -ov

      # ---------------- LINUX ----------------
      - name: Build Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          pyinstaller --noconfirm --windowed --name MusicPlayer --add-data "assets:assets" main.py

          mkdir -p AppDir
          cp -r dist/MusicPlayer AppDir/

          wget -q https://github.com/AppImage/AppImageKit/releases/latest/download/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage AppDir MusicPlayer-Linux.AppImage

      # ---------------- CHANGELOG ----------------
      - name: Generate Changelog
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          git log -1 --pretty=format:"%s" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # ---------------- UPLOAD ARTIFACTS ----------------
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MusicPlayer-${{ matrix.os }}
          path: |
            MusicPlayer-Windows.zip
            MusicPlayer-macOS.dmg
            MusicPlayer-Linux.AppImage

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MusicPlayer v1.0.${{ github.run_number }}
          body: |
            ${{ github.event.head_commit.message }}
          files: |
            **/*.zip
            **/*.dmg
            **/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build & Release Music Player

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Show versions
        run: |
          python --version
          pip --version
          pyinstaller --version

      - name: Verify Python runtime
        run: |
          python -c "import struct; import _struct; print('struct OK')"
          python -c "import PySide6; print('PySide6 OK')"

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

          xvfb-run pyinstaller \
            --clean \
            --noconfirm \
            --windowed \
            --name MusicPlayer \
            --add-data "assets:assets" \
            main.py

      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          pyinstaller \
            --clean \
            --noconfirm \
            --windowed \
            --name MusicPlayer \
            --add-data "assets:assets" \
            --icon assets/icon.icns \
            --hidden-import=_struct \
            --hidden-import=struct \
            --collect-submodules encodings \
            main.py

      - name: Verify macOS bundle contents
        if: matrix.os == 'macos-latest'
        run: |
          echo "=== STRUCT FILES ==="
          find dist -iname "*struct*" || true

          echo "=== ASSETS ==="
          find dist -name "default_cover.png" || true
          find dist -name "icon.png" || true

          echo "=== APP CONTENTS ==="
          find dist/MusicPlayer.app/Contents -maxdepth 4 | head -200 || true

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          pyinstaller `
            --clean `
            --noconfirm `
            --windowed `
            --name MusicPlayer `
            --add-data "assets;assets" `
            --icon assets/icon.ico `
            main.py

      - name: Create zip
        run: |
          python -c "import shutil; shutil.make_archive('MusicPlayer-${{ matrix.os }}', 'zip', 'dist')"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicPlayer-${{ matrix.os }}
          path: MusicPlayer-${{ matrix.os }}.zip


      - name: Debug GitHub context
        run: |
          echo "github.ref=${{ github.ref }}"
          echo "github.ref_name=${{ github.ref_name }}"
          echo "github.event_name=${{ github.event_name }}"
  
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all builds
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
